schema_version: "1.1"
name: chess-coaching-trial-reel
expected_outcome: |
  A shoot-ready reel plan for a chess coach selling a free trial lesson: one idea, a named trigger for each of the three beats (stop, hold, pay off), a hook described as what is seen, read and heard, alternate hooks to test, a timed beat sheet using only what the user can film (themselves at a board, chess.com screen recordings), one call to action toward booking the trial, a caption, and an honest check with remaining risks. No guarantee of views.
